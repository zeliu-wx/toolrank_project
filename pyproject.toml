[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakes"
version = "0.1.0"
description = "Smart-contract analyzer recommendation and execution pipeline"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "QuantifyX"}]
dependencies = [
  "typer>=0.12.0",
  "pydantic>=2.7.0",
  "numpy>=1.26.0",
  "py-solc-x>=1.1.1",
  "semantic-version>=2.8.5",
]

[project.scripts]
lakes = "toolrank.cli:main"
lakes-runner = "toolrank.runner:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["toolrank*"]

[tool.setuptools.package-data]
toolrank = ["config/*.csv", "config/*.json"]
