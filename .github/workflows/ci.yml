name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and test tooling
        run: python -m pip install --upgrade pip build pytest "setuptools>=68" wheel

      - name: Build distributions
        run: python -m build

      - name: Install wheel and check dependencies
        run: |
          python -m pip install dist/*.whl
          python -m pip check

      - name: Verify public toolcards in wheel
        run: |
          test ! -e toolcards/.private
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          expected = {
              "toolcards/__init__.py",
              "toolcards/vector_index/index.json",
          } | {
              path.as_posix() for path in Path("toolcards").glob("*.json")
          }
          with zipfile.ZipFile(wheel) as archive:
              packaged = {
                  name
                  for name in archive.namelist()
                  if name.startswith("toolcards/") and not name.endswith("/")
              }
          assert packaged == expected, (sorted(expected - packaged), sorted(packaged - expected))
          PY

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q toolrank tests
